name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: gabriel-linux-x86_64
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: gabriel-linux-aarch64
          - runner: macos-15
            target: x86_64-apple-darwin
            artifact: gabriel-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: gabriel-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/gabriel dist/${{ matrix.artifact }}
          shasum -a 256 dist/${{ matrix.artifact }} | awk '{print $1}' > dist/${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
