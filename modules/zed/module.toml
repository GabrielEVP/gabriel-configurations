schema_version = 1
id = "zed"
description = "Zed editor configuration"
dependencies = []
[platforms.ubuntu]
minimum_os = "24.04"
architectures = ["x86_64", "aarch64"]
graphical = true
[platforms.macos]
minimum_os = "14"
architectures = ["x86_64", "aarch64"]
graphical = true
[[files]]
source = "settings.json"
base = "config"
target = "zed/settings.json"
local_only = true
[[files]]
source = "keymap.json"
base = "config"
target = "zed/keymap.json"
