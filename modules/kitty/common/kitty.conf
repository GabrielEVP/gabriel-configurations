# Kitty Configuration
# Mirrors Ghostty theme and settings

## Font
font_family IosevkaTerm Nerd Font
bold_font IosevkaTerm Nerd Font Bold
italic_font IosevkaTerm Nerd Font Italic
bold_italic_font IosevkaTerm Nerd Font Bold Italic
font_size 14

## Window
background_opacity 0.80
background_blur 20
hide_window_decorations yes
window_padding_width 8
confirm_os_window_close 0

## Tab bar
tab_bar_style hidden

## Cursor
cursor_shape beam
cursor_beam_thickness 2.0

## Scrollback
scrollback_lines 10000
scrollback_pager_history_size 100

## Colors
# Background / Foreground
background #0a0a0b
foreground #f3f6f9
selection_background #1e1e20
selection_foreground #f3f6f9

# Cursor
cursor #e0c15a
cursor_text_color #0a0a0b

# Normal colors
color0 #0a0a0b
color1 #cb7c94
color2 #b7cc85
color3 #ffe066
color4 #7fb4ca
color5 #ff8dd7
color6 #7aa89f
color7 #f3f6f9

# Bright colors
color8 #8a8fa3
color9 #de8fa8
color10 #d1e8a9
color11 #fff7b1
color12 #a3d4d5
color13 #ffaeea
color14 #7fb4ca
color15 #f3f6f9

## Keybindings (matching Ghostty)

# Clear screen
map ctrl+k clear_terminal reset active

# Splits
map alt+v launch --location=hsplit
map alt+d launch --location=vsplit

# Navigate splits
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Resize splits
map ctrl+shift+h resize_window narrower
map ctrl+shift+l resize_window wider
map ctrl+shift+k resize_window taller
map ctrl+shift+j resize_window shorter

# Miscellaneous
map alt+s clipboard_export -m "copy to terminal"
