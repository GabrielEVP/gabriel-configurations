[package]
name = "gabriel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"
